<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Interactive Virtual Aquarium</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #021d38 0%, #000814 100%);
      font-family: Arial, sans-serif;
    }
    #info-panel {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      color: #00f0ff;
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: none;
      text-shadow: 0 0 8px #00f0ff;
      z-index: 10;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <!-- Import Three.js Graphics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="info-panel">AQUARIUM DEMO — TAP SCREEN TO ATTRACT FISH</div>

  <script>
    // 1. Setup Three.js 3D Scene, Camera, and Renderer
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x001021, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. Underwater Lighting
    const ambientLight = new THREE.AmbientLight(0x0a355c, 1.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0x00e1ff, 2.0);
    sunLight.position.set(0, 50, 20);
    scene.add(sunLight);

    // 3. Procedural Fish Mesh Construction
    function createFishMesh(colorHex) {
      const fishGroup = new THREE.Group();

      // Body Geometry
      const bodyGeo = new THREE.ConeGeometry(1.2, 3.5, 8);
      const bodyMat = new THREE.MeshPhongMaterial({
        color: colorHex,
        shininess: 80,
        flatShading: true
      });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.z = -Math.PI / 2;
      fishGroup.add(body);

      // Tail Fin
      const tailGeo = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        0, 0, 0,
        -1.5, 1.0, 0,
        -1.5, -1.0, 0
      ]);
      tailGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      const tailMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide });
      const tail = new THREE.Mesh(tailGeo, tailMat);
      tail.position.x = -1.75;
      tail.name = "tail";
      fishGroup.add(tail);

      return fishGroup;
    }

    // 4. Instantiate School of Fish
    const fishes = [];
    const colors = [0xff4500, 0x00f0ff, 0xffd700, 0xff007f, 0x00ff88];
    const numFishes = 15;

    for (let i = 0; i < numFishes; i++) {
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const fish = createFishMesh(randomColor);
      
      fish.position.set(
        (Math.random() - 0.5) * 40,
        (Math.random() - 0.5) * 30,
        (Math.random() - 0.5) * 20
      );

      fish.userData = {
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.1,
          (Math.random() - 0.5) * 0.05
        ),
        swimOffset: Math.random() * 100
      };

      scene.add(fish);
      fishes.push(fish);
    }

    // 5. Target Pointer for Touch / Tap Interaction
    const targetPosition = new THREE.Vector3(0, 0, 0);

    function onTouchMove(event) {
      let x, y;
      if (event.touches) {
        x = event.touches[0].clientX;
        y = event.touches[0].clientY;
      } else {
        x = event.clientX;
        y = event.clientY;
      }
      targetPosition.x = ((x / window.innerWidth) * 2 - 1) * 20;
      targetPosition.y = (-(y / window.innerHeight) * 2 + 1) * 15;
    }
    window.addEventListener('mousemove', onTouchMove);
    window.addEventListener('touchstart', onTouchMove);
    window.addEventListener('touchmove', onTouchMove);

    // 6. Animation Loop
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      fishes.forEach((fish) => {
        // Move towards touch target slowly
        const dir = new THREE.Vector3().subVectors(targetPosition, fish.position).normalize();
        fish.userData.velocity.addScaledVector(dir, 0.002);
        fish.userData.velocity.clampLength(0, 0.12);

        fish.position.add(fish.userData.velocity);

        // Rotate fish towards movement direction
        const angle = Math.atan2(fish.userData.velocity.y, fish.userData.velocity.x);
        fish.rotation.z = angle;

        // Tail Wiggle Animation
        const tail = fish.getObjectByName("tail");
        if (tail) {
          tail.rotation.y = Math.sin(time * 8 + fish.userData.swimOffset) * 0.4;
        }

        // Boundary rebound
        if (Math.abs(fish.position.x) > 25) fish.userData.velocity.x *= -1;
        if (Math.abs(fish.position.y) > 20) fish.userData.velocity.y *= -1;
        if (Math.abs(fish.position.z) > 15) fish.userData.velocity.z *= -1;
      });

      renderer.render(scene, camera);
    }
    animate();

    // Responsive Canvas Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
    </html>
